apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: repro-sample
  namespace: default
spec:
  schedulerName: volcano
  replicas: 1
  template:
    roles:
      - name: predictor
        replicas: 1
        entryTemplate:
          spec:
            containers:
              - name: leader
                image: nginx:alpine
                resources:
                  requests:
                    cpu: 10m
                    memory: 10Mi
        workerReplicas: 0
