apiVersion: v1
kind: Namespace
metadata:
  name: eviction-006-kind-role-rolling
---
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: evict-role-rolling
  namespace: eviction-006-kind-role-rolling
spec:
  replicas: 3
  schedulerName: volcano
  rolloutStrategy:
    evictionStrategy:
      protectionLevel: Role
      minAvailable: 2
      roleMinAvailable:
        prefill: 2
        decode: 2
  template:
    roles:
    - name: prefill
      replicas: 3
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "sleep 3600"]
    - name: decode
      replicas: 3
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "sleep 3600"]
