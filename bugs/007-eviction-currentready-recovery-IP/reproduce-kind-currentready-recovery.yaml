apiVersion: v1
kind: Namespace
metadata:
  name: eviction-007-currentready
---
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: evict-currentready
  namespace: eviction-007-currentready
spec:
  replicas: 3
  schedulerName: volcano
  rolloutStrategy:
    evictionStrategy:
      protectionLevel: ServingGroup
      minAvailable: 2
  template:
    roles:
    - name: prefill
      replicas: 1
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "sleep 3600"]
    - name: decode
      replicas: 1
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "sleep 3600"]
