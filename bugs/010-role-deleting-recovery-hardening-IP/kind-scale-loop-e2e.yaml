apiVersion: v1
kind: Namespace
metadata:
  name: kthena-e2e-010-scale
---
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: scale-loop-e2e-010
  namespace: kthena-e2e-010-scale
spec:
  schedulerName: volcano
  replicas: 1
  recoveryPolicy: RoleRecreate
  template:
    restartGracePeriodSeconds: 0
    roles:
      - name: prefill
        replicas: 1
        workerReplicas: 1
        entryTemplate:
          spec:
            containers:
              - name: entry
                image: registry.k8s.io/pause:3.10
                imagePullPolicy: IfNotPresent
        workerTemplate:
          spec:
            containers:
              - name: worker
                image: registry.k8s.io/pause:3.10
                imagePullPolicy: IfNotPresent
