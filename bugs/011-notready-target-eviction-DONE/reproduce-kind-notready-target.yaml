apiVersion: v1
kind: Namespace
metadata:
  name: eviction-011-notready-target
---
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: evict-sg-target-notready
  namespace: eviction-011-notready-target
spec:
  replicas: 3
  schedulerName: volcano
  rolloutStrategy:
    evictionStrategy:
      protectionLevel: ServingGroup
      minAvailable: 2
  template:
    roles:
    - name: prefill
      replicas: 1
      workerReplicas: 0
      entryTemplate:
        spec:
          nodeSelector:
            kubernetes.io/hostname: kind-worker
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "touch /tmp/ready; sleep 3600"]
            readinessProbe:
              exec:
                command: ["sh", "-c", "test -f /tmp/ready"]
              periodSeconds: 2
---
