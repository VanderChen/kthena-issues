apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: evict-validation-sg-above-replicas
spec:
  replicas: 3
  schedulerName: volcano
  rolloutStrategy:
    type: ServingGroupRollingUpdate
    evictionStrategy:
      protectionLevel: ServingGroup
      minAvailable: 4
  template:
    roles:
    - name: decode
      replicas: 1
      entryTemplate:
        spec:
          containers:
          - name: decode
            image: nginx:1.25
      workerReplicas: 0
