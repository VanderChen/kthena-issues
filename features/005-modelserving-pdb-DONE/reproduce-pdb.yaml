apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: vllm-pdb-test
spec:
  replicas: 3
  schedulerName: volcano
  rolloutStrategy:
    evictionStrategy:
      protectionLevel: ServingGroup
      minAvailable: 2
  template:
    roles:
    - name: worker
      replicas: 1
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            command: ["sh", "-c", "sleep 3600"]
