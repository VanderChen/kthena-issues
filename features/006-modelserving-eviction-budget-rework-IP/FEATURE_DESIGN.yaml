## 5. 性能

性能涉及。分析如下：

- 默认关闭集群级 eviction webhook，因此默认无 admission 性能影响。
- 开启后，kube-apiserver 会对匹配的 `pods/eviction` 请求调用 webhook。
- handler 使用 informer lister 读取 Pod 和 ModelServing。
- allow 并消费预算时会对该 ModelServing 的 tracker ConfigMap 执行一次 read-modify-write。
- tracker 使用 ConfigMap `resourceVersion` 冲突重试保证多副本一致性。
- 单次预算计算复杂度约为目标 ModelServing Pod 数量 O(n)，额外增加一次 ConfigMap GET/UPDATE。
- 开启时 controller-manager 可多副本运行；该流量通常来自节点 drain，非高频业务流量。

性能风险：

- 单个 ModelServing Pod 数量极大时，单次 eviction 决策需要遍历该 ModelServing Pod 列表。
- 大规模并发 drain 同时消费同一个 ModelServing 预算时，会在同一个 tracker ConfigMap 上产生 resourceVersion 冲突和重试。

缓解：

- 默认关闭。
- 仅配置了 `evictionStrategy` 的 ModelServing 进入预算计算。
- 每个 ModelServing 一个 tracker ConfigMap，避免所有 workload 共享一个全局热点对象。
- 后续可增加按 ModelServing/role/group 的索引缓存优化。

