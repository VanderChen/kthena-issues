不涉及。该特性通过 Kubernetes CRD、Helm values 和 admission webhook 生效，无 Console/UI 变更。

### 4.3 API设计

#### 4.3.1 对外API变更(服务自身API)

新增/变更 Kubernetes CRD 字段：

```go
type RolloutStrategy struct {
    EvictionStrategy *EvictionStrategySpec `json:"evictionStrategy,omitempty"`
}

type EvictionStrategySpec struct {
    ProtectionLevel ProtectionLevelType `json:"protectionLevel"`
    MinAvailable *intstr.IntOrString `json:"minAvailable,omitempty"`
    RoleMinAvailable map[string]intstr.IntOrString `json:"roleMinAvailable,omitempty"`
}
```

字段语义：

- `protectionLevel`: `ServingGroup` 或 `Role`。
- `minAvailable`: ServingGroup 模式阈值；Role 模式下作为未显式配置 role-specific 阈值时的默认阈值。
- `roleMinAvailable`: Role 模式下 role-specific 阈值，key 必须匹配 `spec.template.roles[*].name`。

新增 admission endpoint：

- URL path：`/validate-eviction`
- 类型：Kubernetes 内部 admission webhook，不是 OpenAPI。
- 资源：`apiGroups=[""]`, `resources=["pods/eviction"]`, `operations=["CREATE"]`
- 返回：
  - allow：AdmissionResponse `allowed=true`
  - deny：AdmissionResponse `allowed=false`, status code `429`, message 包含拒绝原因

权限控制：

- 不新增租户 OpenAPI 权限模型。
- 复用 Kubernetes admission webhook 和 controller-manager ServiceAccount 权限。

流控规模：

- 仅节点 drain 或 eviction 客户端触发。
- 默认关闭，开启后受 kube-apiserver admission 调用链路影响。

