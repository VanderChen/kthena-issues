# ModelServing Eviction Webhook 逻辑预算保护 Feature Design

## US/FE编号: 006 ModelServing Eviction Webhook 逻辑预算保护

---

## 1. 需求概述

本特性为 Kthena `ModelServing` 增加基于 `pods/eviction` admission webhook 的逻辑中断预算保护能力，用于在节点 drain、节点迁移、OS 升级等主动驱逐场景中，避免 Kubernetes 原生 PDB 只按 Pod 数量保护而无法感知 `ServingGroup`、`Role` 等 Kthena 逻辑边界的问题。

当前版本策略：

- 集群级 eviction webhook 默认关闭，避免默认引入 admission 链路开销。
- 开启后，只有显式配置 `spec.rolloutStrategy.evictionStrategy` 的 `ModelServing` 会启用保护。
- 支持 `ServingGroup` 级保护和 `Role` 级保护。
- `Role` 级保护支持 `roleMinAvailable`，不同 role 可配置不同的最小可用逻辑实例数。
- 并发 drain 通过 ConfigMap-backed logical-unit tracker 处理 informer cache lag，支持 controller-manager 多副本。

---

## 2. 需求分析

LLM 推理服务通常不是单 Pod 独立提供完整能力。一个可用实例可能由一个 `ServingGroup` 内多个 Pod，或一个 role instance 内 entry/worker 多个 Pod 共同组成。原生 PDB 只理解 Pod 数量，无法表达“任一 Pod 被驱逐后整个 ServingGroup 或 role instance 视为不可用”的语义。

本特性通过拦截 Kubernetes `pods/eviction` 子资源请求，在 admission 阶段按 Kthena 逻辑单元计算可用预算。这样运维人员仍可使用 `kubectl drain` 等标准方式迁移节点，同时 Kthena 能避免短时间内多个逻辑服务实例同时失效。

### 2.1 Goals & Non-Goals

#### Goals

- 支持 `ServingGroup` 级 `minAvailable` 保护。
  - 验收：当 Ready ServingGroup 数量等于 `minAvailable` 时，驱逐另一个 Ready ServingGroup 的 Pod 会被拒绝。
- 支持 `Role` 级保护，并允许不同 role 配置不同的 `roleMinAvailable`。
  - 验收：`decode`、`prefill` 等 role 可分别定义预算；未知 role key 被 ModelServing validating webhook 拒绝。
- `Role` 级保护按 `role-id` 逻辑实例统计，而不是按 Pod 统计。
  - 验收：同一 `role-id` 的 entry/worker 后续 Pod 驱逐被允许，不重复消费预算；另一个 `role-id` 在预算不足时被拒绝。
- 支持短时间多节点 drain 并发场景。
  - 验收：第一条 eviction allow 后，在 informer 看到 Pod deletion 前，tracker 已将对应逻辑单元视为不可用。
- 提供集群级开关。
  - 验收：默认不渲染 `pods/eviction` webhook；开启后渲染；关闭后从 `ValidatingWebhookConfiguration` 中移除。
- 保持标准 Kubernetes eviction 语义。
  - 验收：拒绝时返回 admission deny 和 HTTP 429 语义，使 drain 客户端退避重试。

#### Non-Goals

- 不替代 Kubernetes 原生 PDB 的全部能力。
- 不处理直接 `DELETE pod` 绕过 `pods/eviction` 的场景。
- 不引入新的 DB 或 CRD tracker。
- 不要求 admission Service 定向路由到 leader。
- 不新增 UI/Console 能力。
- 不新增计费能力。

### 2.2 交付范围

| 交付局点和场景 | 差异化汇总 | 备注 |
|--------------|----------|------|
| HC | 不涉及 | 当前为开源 Kthena/Kubernetes 集群能力设计，不区分云局点 |
| HCS | 不涉及 | 如产品化交付，需要补充发行版配套策略 |
| HCSO | 不涉及 | 同上 |
| 合营云 | 不涉及 | 不涉及伙伴云差异化 API |
| 支持企业项目 | 不涉及 | 不涉及企业项目、租户项目模型 |

> 不涉及交付场景差异。

### 2.3 友商分析

- Kubernetes 原生 PDB：
  - 优点：稳定、标准、与 eviction API 原生集成。
  - 缺点：只按 Pod selector 和 Pod 数量统计，不理解 Kthena `ServingGroup`、`Role`、`role-id` 等逻辑边界。
- Volcano gang scheduling：
  - 优点：支持调度阶段的 gang 语义和 role 最小副本约束。
  - 缺点：主要约束调度启动，不负责节点 drain 时的逻辑中断预算。
- LeaderWorkerSet / Ray 等分布式工作负载：
  - 通常会在控制器层实现组级恢复或重建，但不一定提供通用 eviction admission 保护。

结论：Kthena 需要在自身 controller-manager admission webhook 中补充逻辑预算保护。

### 2.4 需求约束

- 依赖 Kubernetes admissionregistration v1 和 `pods/eviction` 子资源。
- 依赖 Kthena controller-manager webhook server 可用。
- 依赖 Pod 带有 Kthena labels：
  - `modelserving.volcano.sh/name`
  - `modelserving.volcano.sh/group-name`
  - `modelserving.volcano.sh/role`
  - `modelserving.volcano.sh/role-id`
- `Role` 级保护要求按 `role-id` 聚合逻辑实例。
- eviction webhook 开启时 Helm 将 controller-manager 渲染为 1 副本。
- tracker TTL 只覆盖 informer lag，不代表 Pod termination grace period 或服务恢复时间。
- Helm 安装后如已有 CRD，`crds/` 目录不会自动升级 CRD schema，升级时需明确 CRD 更新策略。

---

## 3. 解决方案

整体方案是在 Kthena controller-manager webhook server 中新增 `/validate-eviction` handler，并通过 Helm 可选渲染 `ValidatingWebhookConfiguration` 中的 `pods/eviction` 规则。

准入逻辑：

- 解析 eviction 目标 Pod。
- 根据 Pod label 找到所属 `ModelServing`。
- 如果未配置 `evictionStrategy`，直接放行。
- 如果 `protectionLevel=ServingGroup`，按 `group-name` 统计 Ready ServingGroup 数量。
- 如果 `protectionLevel=Role`，按 `role + role-id` 统计 Ready role instance 数量。
- 对已放行但 informer 尚未同步 deletion 的逻辑单元，通过 ConfigMap tracker 临时视为 unavailable。
- 如果驱逐会使 Ready 逻辑单元数不满足阈值，拒绝并返回 429。

### 3.1 User Stories

#### 3.1.1 Story 1

作为一个集群运维人员，我想要在执行节点 drain 时自动限制同一 `ModelServing` 中同时不可用的 `ServingGroup` 数量，以便节点维护不会导致推理服务容量骤降。

#### 3.1.2 Story 2

作为一个模型服务管理员，我想要为不同 role 配置不同的 `minAvailable`，以便 `prefill`、`decode` 等角色能按实际容量和业务重要性设置不同保护策略。

#### 3.1.3 Story 3

作为一个平台管理员，我想要默认关闭 eviction webhook，并在需要时通过 Helm 开启，以便在没有保护诉求的集群中不引入额外 admission 开销。

#### 3.1.4 Story 4

作为一个故障处理人员，我想要 webhook 拒绝时返回清晰的拒绝原因，以便快速判断是哪个 `ModelServing`、哪个 role 或 group 预算不足。

### 3.2 架构影响分析

| 影响项 | 是否影响(是/否) | 影响点汇总 |
|-------|---------------|----------|
| 架构元素 | 是 | controller-manager webhook server 增加 `/validate-eviction` admission 处理路径 |
| 刷新特性树 | 是 | 新增 ModelServing eviction protection 能力 |
| 刷新arch-model组件关系 | 否 | 不新增组件，仅扩展现有 controller-manager |
| 技术选型(关键开源/三方、依赖分析与选型) | 否 | 复用 Kubernetes admission webhook、client-go informer、Helm |
| 安全隐私 | 是 | 新增 admission 拒绝路径，需确认 RBAC/webhook 证书沿用现有机制 |
| 其他 | 是 | 开启 eviction webhook 时 controller-manager 可多副本运行；共享预算状态由 ConfigMap tracker 保证 |

### 3.3 功能规格

#### 静态规格

- Kubernetes：需支持 `policy/v1` Eviction 和 admissionregistration.k8s.io/v1。
- OS：不涉及特定 OS。
- 架构：支持 controller-manager 可编译运行的架构；Kind 实测 arm64。
- 集群：需安装 Kthena workload CRD 和 controller-manager webhook 证书配置。
- 调度器：测试环境使用 Volcano；本特性自身不强依赖具体 scheduler，但 `ModelServing` 示例使用 `schedulerName: volcano`。

#### 兼容性关系

- 与现有 `ModelServing` 兼容：未配置 `evictionStrategy` 时不改变 eviction 行为。
- Helm 默认关闭 eviction webhook，避免升级后默认影响已有 drain 行为。
- CRD schema 需要升级后才能接受 `roleMinAvailable` 字段。

### 3.4 风险及设计约束

- webhook 不可用且 `failurePolicy=Fail` 时，匹配的 eviction 请求会失败。默认关闭可降低风险。
- ConfigMap tracker 写入依赖 kube-apiserver；API Server 写失败时 eviction webhook 会拒绝请求以避免突破预算。
- 直接删除 Pod 不经过 `pods/eviction`，不会被此能力保护。
- tracker TTL 太短可能不能覆盖 informer lag；太长可能保守占用预算。
- Helm `crds/` 升级需显式处理，否则新 API 字段可能被 API Server strict decoding 拒绝。

### 3.5 可选的替代方案

- 原生 PDB：不满足逻辑单元保护。
- 内存 tracker + 单 leader 路由：性能最好，但需要额外维护 leader-only Service endpoint/selector，存在 stale endpoint/label 清理复杂度；本版本不采用。
- ConfigMap tracker：每个 ModelServing 一个 ConfigMap，使用 `resourceVersion` 冲突重试保证多副本并发一致性；本版本采用该方案。

---

## 4. 详细设计

### 4.1 ModelServing Eviction Budget 详细设计

本特性提供完整的 `ModelServing` eviction 逻辑预算保护能力。核心由四部分组成：

| 模块 | 职责 | 关键输入 | 关键输出 |
|-----|------|---------|---------|
| ModelServing API | 声明 workload 级 eviction 保护策略 | `spec.rolloutStrategy.evictionStrategy` | `protectionLevel`、`minAvailable`、`roleMinAvailable` |
| ModelServing validating webhook | 校验策略合法性 | ModelServing create/update | 拒绝非法 `roleMinAvailable` key 和非法 int-or-percent |
| Eviction admission webhook | 拦截 `pods/eviction` 并执行预算判定 | Eviction admission request、Pod labels、ModelServing、Pod readiness | allow 或 deny 429 |
| Logical-unit tracker | 覆盖 informer cache lag 下的并发 drain 窗口 | 已 allow 的逻辑单元、TTL、ConfigMap `resourceVersion` | 在 TTL 内把逻辑单元视为 unavailable，并通过冲突重试保证多副本一致性 |

#### 4.1.1 配置入口和生效边界

集群级开关由 Helm values 控制：

- `workload.controllerManager.evictionWebhook.enabled=false` 时：
  - Helm 不渲染 `pods/eviction` validating webhook rule。
  - controller-manager 仍注册 allow handler 兜底，避免 webhook rule 残留时误阻塞 drain。
  - `ModelServing.spec.rolloutStrategy.evictionStrategy` 只作为 CRD 字段存在，不影响 eviction admission。
- `workload.controllerManager.evictionWebhook.enabled=true` 时：
  - Helm 渲染 `eviction.modelserving.volcano.sh` webhook rule。
  - controller-manager 通过 `--enable-eviction-webhook=true` 启用真实 handler。
  - Helm 保留 `controllerManager.replicas` 配置，不因 eviction webhook 开启而强制单副本。

单个 `ModelServing` 的保护入口是：

```yaml
spec:
  rolloutStrategy:
    evictionStrategy:
      protectionLevel: Role
      minAvailable: 1
      roleMinAvailable:
        prefill: 1
        decode: 2
```

字段约束：

- `protectionLevel=ServingGroup` 时，`minAvailable` 表示最少可用 ServingGroup 数量或百分比。
- `protectionLevel=Role` 时，`roleMinAvailable[roleName]` 表示该 role 的最少可用逻辑实例数量或百分比。
- `roleMinAvailable` 的 key 必须存在于 `spec.template.roles[*].name`。
- `roleMinAvailable` 的 value 必须是合法 Kubernetes `IntOrString`，百分比范围为 `0%-100%`。

#### 4.1.2 逻辑单元定义

Webhook 不按 Pod 数量消费预算，而按 Kthena 逻辑单元消费预算。

| protectionLevel | 逻辑单元 key | Ready 判定 | 预算含义 |
|-----------------|-------------|-----------|---------|
| `ServingGroup` | namespace + modelServing + groupName | group 内 Pod 状态满足 ServingGroup ready 规则 | 最少保留多少个 Ready ServingGroup |
| `Role` | namespace + modelServing + role + roleID | 同一 `role + role-id` 下的 Pod 状态满足 role instance ready 规则 | 每个 role 最少保留多少个 Ready role instance |

Role 模式必须使用 `role-id` 聚合。原因是一个 role instance 可能包含 entry/worker 多个 Pod；驱逐同一 `role-id` 的第二个 Pod 不应再次消费一个逻辑实例预算。

#### 4.1.3 ModelServing 策略校验流程

```mermaid
sequenceDiagram
    autonumber
    participant User as "User"
    participant APIServer as "kube-apiserver"
    participant MSWebhook as "ModelServing validating webhook"
    participant Store as "etcd"

    User->>APIServer: "create/update ModelServing"
    APIServer->>MSWebhook: "admission review"
    MSWebhook->>MSWebhook: "collect spec.template.roles[*].name"
    MSWebhook->>MSWebhook: "validate roleMinAvailable keys"
    MSWebhook->>MSWebhook: "validate IntOrString values"
    alt "invalid strategy"
        MSWebhook-->>APIServer: "deny with field error"
        APIServer-->>User: "request rejected"
    else "valid strategy"
        MSWebhook-->>APIServer: "allow"
        APIServer->>Store: "persist ModelServing"
        APIServer-->>User: "success"
    end
```

该校验放在 ModelServing validating webhook 中，而不是 eviction webhook 中延迟处理。这样非法 role key 在资源创建或更新时立即失败，避免节点维护时才暴露配置错误。

#### 4.1.4 Eviction admission 总体时序

```mermaid
sequenceDiagram
    autonumber
    participant Drain as "kubectl drain or eviction client"
    participant APIServer as "kube-apiserver"
    participant EvictWebhook as "Kthena eviction webhook"
    participant PodCache as "Pod informer cache"
    participant MSCache as "ModelServing informer cache"
    participant Tracker as "logical-unit tracker"

    Drain->>APIServer: "create pods/eviction"
    APIServer->>EvictWebhook: "AdmissionReview"
    EvictWebhook->>PodCache: "get target Pod"
    EvictWebhook->>EvictWebhook: "read Kthena labels"
    alt "not a Kthena ModelServing Pod"
        EvictWebhook-->>APIServer: "allow"
    else "Kthena ModelServing Pod"
        EvictWebhook->>MSCache: "get ModelServing"
        alt "evictionStrategy unset"
            EvictWebhook-->>APIServer: "allow"
        else "evictionStrategy set"
            EvictWebhook->>PodCache: "list sibling Pods"
            EvictWebhook->>Tracker: "remove expired entries"
            EvictWebhook->>EvictWebhook: "calculate ready logical units"
            EvictWebhook->>Tracker: "subtract already disrupting units"
            alt "evicting same disrupting unit"
                EvictWebhook-->>APIServer: "allow"
            else "ready count would be <= minAvailable"
                EvictWebhook-->>APIServer: "deny 429"
            else "budget remains available"
                EvictWebhook->>Tracker: "record logical unit with TTL"
                EvictWebhook-->>APIServer: "allow"
            end
        end
    end
    APIServer-->>Drain: "eviction response"
```

拒绝使用 429 语义，保持 Kubernetes eviction/PDB 风格，drain 客户端可以退避后重试。

#### 4.1.5 ServingGroup 模式判定算法

输入：

- eviction target Pod。
- target Pod label `modelserving.volcano.sh/group-name`。
- 同 namespace、同 ModelServing 的所有 Pod。
- `minAvailable`。
- tracker 中未过期的 ServingGroup logical unit。

处理步骤：

1. 通过 target Pod label 得到 `ModelServing` 和 target `groupName`。
2. 列出同一 `ModelServing` 的 Pods，并按 `groupName` 聚合。
3. 对每个 group 判断 Ready 状态，得到 Ready group 集合。
4. 从 Ready group 集合中扣除 tracker 里未过期的 group。
5. 如果 target group 已在 tracker 中，说明前序 eviction 已经消费该 group 预算，本次允许。
6. 否则计算本次驱逐后的 Ready group 数量。
7. 若数量 `<= minAvailable`，deny 429。
8. 若数量 `> minAvailable`，allow 并把 target group 写入 tracker。

```mermaid
flowchart TD
    A["Receive eviction for target Pod"] --> B["Resolve target ServingGroup"]
    B --> C["List Pods of ModelServing"]
    C --> D["Group Pods by group-name"]
    D --> E["Build Ready ServingGroup set"]
    E --> F["Subtract tracked disrupting groups"]
    F --> G{"Target group already tracked?"}
    G -->|Yes| H["Allow eviction"]
    G -->|No| I{"Ready groups after eviction <= minAvailable?"}
    I -->|Yes| J["Deny 429"]
    I -->|No| K["Track target group with TTL"]
    K --> H
```

#### 4.1.6 Role 模式判定算法

输入：

- eviction target Pod。
- target Pod labels `role` 和 `role-id`。
- 同 namespace、同 ModelServing、同 role 的所有 Pod。
- `roleMinAvailable[targetRole]`；若该 role 未配置，则使用 `minAvailable` 作为默认阈值。
- tracker 中未过期的 role logical unit。

处理步骤：

1. 通过 target Pod label 得到 `ModelServing`、target `role` 和 target `roleID`。
2. 从 `roleMinAvailable` 读取 target role 的阈值；如果该 role 未显式配置，则读取 `minAvailable`。
3. 列出同一 `ModelServing` 的 Pods，并筛选同 role Pods。
4. 按 `role-id` 聚合为 role instance。
5. 对每个 role instance 判断 Ready 状态，得到 Ready role instance 集合。
6. 从 Ready 集合中扣除 tracker 里未过期的 `role + roleID`。
7. 如果 target `role + roleID` 已在 tracker 中，说明同一逻辑实例已有 Pod 被允许驱逐，本次允许，不重复消费预算。
8. 否则计算本次驱逐后的 Ready role instance 数量。
9. 若数量 `<= target role minAvailable`，deny 429。
10. 若数量 `> target role minAvailable`，allow 并把 target `role + roleID` 写入 tracker。

```mermaid
flowchart TD
    A["Receive eviction for target Pod"] --> B["Resolve target role and role-id"]
    B --> C["Read roleMinAvailable for target role"]
    C --> D["Use minAvailable if unset"]
    D --> E["List Pods of ModelServing"]
    E --> F["Filter Pods by target role"]
    F --> G["Group Pods by role-id"]
    G --> H["Build Ready role-instance set"]
    H --> I["Subtract tracked disrupting role instances"]
    I --> J{"Target role-id already tracked?"}
    J -->|Yes| K["Allow eviction"]
    J -->|No| L{"Ready instances after eviction <= role minAvailable?"}
    L -->|Yes| M["Deny 429"]
    L -->|No| N["Track target role-id with TTL"]
    N --> K
```

#### 4.1.7 并发 drain 与 tracker 时序

Informer cache 对 Pod deletion 的感知存在延迟。没有 tracker 时，短时间内多个节点同时 drain 可能都基于同一份旧 cache 判定为可驱逐，从而同时打掉多个逻辑单元。tracker 的含义是：一旦某个逻辑单元的 eviction 被 allow，在 TTL 内即使 informer cache 里 Pod 仍显示 Ready，该逻辑单元也会被预算计算视为 unavailable。

tracker 使用每个 `ModelServing` 一个 ConfigMap 存储，多个 controller-manager 副本通过 kube-apiserver 共享该状态。每次 allow 前执行 read-modify-write；若 ConfigMap `resourceVersion` 冲突，则重新读取最新 tracker 并重新计算预算。

```mermaid
sequenceDiagram
    autonumber
    participant D1 as "drain node A"
    participant D2 as "drain node B"
    participant APIServer as "kube-apiserver"
    participant WebhookA as "webhook replica A"
    participant WebhookB as "webhook replica B"
    participant Cache as "informer cache"
    participant Tracker as "ConfigMap tracker"

    D1->>APIServer: "evict Pod of group-0"
    APIServer->>WebhookA: "AdmissionReview group-0"
    WebhookA->>Cache: "read old Ready state"
    WebhookA->>Tracker: "GET tracker ConfigMap"
    WebhookA->>Tracker: "UPDATE tracker with group-0 and resourceVersion"
    WebhookA-->>APIServer: "allow"
    APIServer-->>D1: "201 Success"

    D2->>APIServer: "evict Pod of group-1 before cache update"
    APIServer->>WebhookB: "AdmissionReview group-1"
    WebhookB->>Cache: "still reads old Ready state"
    WebhookB->>Tracker: "GET tracker ConfigMap"
    WebhookB->>WebhookB: "ready budget excludes tracked group-0"
    alt "budget exhausted"
        WebhookB-->>APIServer: "deny 429"
        APIServer-->>D2: "TooManyRequests"
    else "budget still available"
        WebhookB->>Tracker: "UPDATE tracker with group-1"
        WebhookB-->>APIServer: "allow"
    end
```

tracker 设计约束：

- tracker 是 Kubernetes ConfigMap 状态，每个 ModelServing 一个 ConfigMap。
- eviction webhook 开启时 controller-manager 可多副本运行，任意副本都基于共享 ConfigMap 计算预算。
- ConfigMap 更新使用 `resourceVersion` 冲突重试；冲突后必须重新读取 tracker 并重新计算预算。
- TTL 默认 60s，可通过 `--eviction-tracker-ttl` 配置。
- TTL 只覆盖 informer lag，不表示业务恢复时间，也不等待 Pod graceful termination 完成。
- tracker entry 过期后，预算计算重新完全依赖 informer cache 当前状态。

#### 4.1.8 关键失败和降级路径

| 场景 | 行为 | 设计理由 |
|-----|------|---------|
| 集群级开关关闭 | 不渲染 eviction webhook rule | 默认无 admission 性能开销 |
| webhook rule 残留但 handler 未启用 | allow | 避免配置漂移导致 drain 被误阻塞 |
| target Pod 缺少 Kthena labels | allow | 非 Kthena Pod 不应受此特性影响 |
| target ModelServing 不存在 | allow | 避免删除过程中的缓存不一致阻塞清理 |
| ModelServing 未配置 `evictionStrategy` | allow | 单 workload 显式 opt-in |
| budget 不足 | deny 429 | 保持 eviction/PDB 重试语义 |
| controller-manager 重启 | tracker 保留在 ConfigMap 中 | 支持多副本和进程重启后的预算状态延续 |

