## 10. 测试建议

基本功能：

- 默认 Helm values 下不渲染 `eviction.modelserving.volcano.sh`。
- 开启 `workload.controllerManager.evictionWebhook.enabled=true` 后渲染 webhook rule。
- 开启后 controller-manager 保持用户配置的 `replicas`，不被 eviction webhook 强制改为 1。
- `roleMinAvailable` unknown key 被 ModelServing validating webhook 拒绝。
- `roleMinAvailable` 非法百分比被拒绝。
- ServingGroup 模式：第一个 Ready group eviction allow，预算达到阈值后第二个 group eviction deny。
- Role 模式：同一 role-id 的 entry/worker eviction allow，另一个 role-id 在预算不足时 deny。

异常场景：

- webhook handler 关闭但 rule 残留时，应 allow，避免误阻塞 drain。
- target Pod 缺少 Kthena label 时 allow。
- target ModelServing 不存在或未配置 `evictionStrategy` 时 allow。

可靠性：

- 使用两个 webhook handler 实例短时间连续发多个不同 group/role-id eviction，验证 ConfigMap tracker 跨副本生效。
- tracker TTL 过期后，若 informer 状态仍未变化，预算按当前状态重新计算。
- controller-manager 重启后确认服务可恢复，记录 failover 窗口风险。

运维：

- Helm 开启、关闭 eviction webhook 后检查 `ValidatingWebhookConfiguration`。
- Kind 集群中用 `kubectl create --raw /api/v1/namespaces/<ns>/pods/<pod>/eviction -f <payload.json>` 进行真实 eviction 验证。

性能：

- 对包含大量 Pod 的 ModelServing 执行 eviction 压测，观察 webhook latency。

安全：

- 验证 RBAC：无 eviction 权限用户无法发起 eviction。
- 验证返回信息不包含敏感信息。

