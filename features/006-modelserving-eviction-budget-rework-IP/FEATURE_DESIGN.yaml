### 9.2 资料模块X设计

#### 9.2.1 基本概念

- `ServingGroup`：Kthena 中完成一次推理服务能力的逻辑组。
- `Role`：ServingGroup 内承担特定职责的角色，如 `prefill`、`decode`。
- `role-id`：同一 role 的逻辑实例标识，一个 role instance 可包含 entry/worker 多个 Pod。
- `evictionStrategy`：ModelServing 节点驱逐保护策略。
- `roleMinAvailable`：Role 模式下 role-specific 最小可用逻辑实例数。

#### 9.2.2 功能原理

节点 drain 发起 `pods/eviction` 请求，kube-apiserver 调用 Kthena eviction webhook。webhook 基于 Pod label 找到 ModelServing 并统计逻辑单元可用性。如果驱逐会导致可用逻辑单元数小于或等于阈值，则拒绝，客户端退避重试。

#### 9.2.3 计费说明

不涉及计费。

