## 6. 可靠性

### 6.1 故障管理

| 序号 | 检查项 | 检查结果:是否涉及 |
|-----|-------|-----------------|
| 1 | 是否涉及外部依赖,外部依赖故障后是否对本特性有影响 | 是，依赖 kube-apiserver admission、controller-manager webhook server |
| 2 | 故障是否影响系统功能或性能,是否影响用户功能及体验 | 是，开启且 failurePolicy=Fail 时 webhook 不可用会阻塞 eviction |
| 3 | 故障后是否有监控指标及告警 | 当前不新增，建议后续增加 webhook latency/deny/error 指标 |
| 4 | 故障后能否自愈,比如健康检查失败后重启,任务失败后可自动恢复等 | 是，controller-manager Pod 由 Deployment 维护 |
| 5 | 故障发生后是否能实现故障隔离或服务降级 | 是，可通过 Helm 关闭 eviction webhook rule |

详细场景：

- webhook Pod 不可用：eviction 可能被阻塞；关闭 Helm 开关可移除 rule 降级。
- controller-manager 重启：tracker 保留在 ConfigMap 中，不因进程重启丢失。
- informer cache lag：通过 TTL tracker 覆盖。

### 6.2 系统防呆

| 序号 | 检查项 | 检查结果:是否涉及 |
|-----|-------|-----------------|
| 1 | 是否涉及高危操作,比如删除类操作 | 是，涉及 Pod eviction admission 控制，但不主动删除资源 |
| 2 | 用户是否能绕过本服务直接操作依赖服务 | 是，直接 DELETE Pod 可绕过 `pods/eviction` webhook |

