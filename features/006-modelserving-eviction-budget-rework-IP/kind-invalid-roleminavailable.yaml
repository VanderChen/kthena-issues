apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: invalid-role-budget
  namespace: eviction-006
spec:
  replicas: 1
  schedulerName: volcano
  rolloutStrategy:
    evictionStrategy:
      protectionLevel: Role
      minAvailable: 0
      roleMinAvailable:
        unknown: 1
  template:
    roles:
    - name: decode
      replicas: 1
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "sleep 3600"]
