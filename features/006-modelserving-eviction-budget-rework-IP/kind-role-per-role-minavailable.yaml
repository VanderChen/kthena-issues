apiVersion: v1
kind: Namespace
metadata:
  name: eviction-006-role-per-role-minavailable
---
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: evict-role-per-role-minavailable
  namespace: eviction-006-role-per-role-minavailable
spec:
  replicas: 1
  schedulerName: volcano
  recoveryPolicy: None
  rolloutStrategy:
    evictionStrategy:
      protectionLevel: Role
      roleMinAvailable:
        decode: 2
        prefill: 1
  template:
    roles:
    - name: decode
      replicas: 2
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "sleep 3600"]
    - name: prefill
      replicas: 2
      workerReplicas: 0
      entryTemplate:
        spec:
          containers:
          - name: main
            image: busybox
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "sleep 3600"]
